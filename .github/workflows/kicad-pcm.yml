---
# This is a workflow to generate the zip file and metadata.json for KiCAD PCM
# https://gitlab.com/kicad/addons/metadata/-/merge_requests/14

name: KiCAD PCM packaging
on:  # yamllint disable-line rule:truthy
  release:
    branches: [main]
    types:
      - published
  workflow_dispatch:

jobs:
  create_archive:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest tag
        uses: oprypin/find-latest-tag@v1
        with:
          repository: Bouni/kicad-jlcpcb-tools
          releases-only: true
        id: latest-release

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Create archive
        run: sh ./PCM/create_pcm_archive.sh ${{ steps.latest-release.outputs.tag }}

      - name: Read the KiCad version range from the archive metadata
        run: |
          jq -r '.versions[0]
            | "KICAD_VERSION=\(.kicad_version)",
              "KICAD_VERSION_MAX=\(.kicad_version_max // "")"' \
            PCM/archive/metadata.json >> "$GITHUB_ENV"

      - name: Upload zip as asset to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./PCM/KiCAD-PCM-${{ steps.latest-release.outputs.tag }}.zip
          asset_name: KiCAD-PCM-${{ steps.latest-release.outputs.tag }}.zip
          overwrite: true
          tag: ${{ steps.latest-release.outputs.tag }}

      - name: Trigger custom kicad repo rebuild
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Rebuild repository
          ref: refs/heads/main
          repo: Bouni/bouni-kicad-repository
          token: ${{ secrets.PERSONAL_TOKEN }}
          inputs: '{ "VERSION": "${{env.VERSION}}", "DOWNLOAD_SHA256": "${{env.DOWNLOAD_SHA256}}", "DOWNLOAD_SIZE": "${{env.DOWNLOAD_SIZE}}", "DOWNLOAD_URL": "${{env.DOWNLOAD_URL}}", "INSTALL_SIZE": "${{env.INSTALL_SIZE}}", "KICAD_VERSION": "${{env.KICAD_VERSION}}", "KICAD_VERSION_MAX": "${{env.KICAD_VERSION_MAX}}" }'
