---
name: Lint and format everything
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup NodeJS
        uses: actions/setup-node@v7
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint "**/*.md"
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Check code with ruff
        uses: chartboost/ruff-action@v1
        with:
          version: 0.11.4
          args: check 
          src: "."
  python-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up KiCad-compatible Python
        id: kicad-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Set up Python for hook tools
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install hook regression test dependencies
        run: python -m pip install pytest pre-commit
      - name: Verify hook output on Python 3.9
        run: python -m pytest -q tests/test_hook_python_compatibility.py
        env:
          KICAD_TEST_PYTHON: ${{ steps.kicad-python.outputs.python-path }}
  deadcode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deadcode
        run: pip install deadcode
      - name: Run deadcode
        run: deadcode .
