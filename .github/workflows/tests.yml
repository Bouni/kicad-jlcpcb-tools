---
name: Tests
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      generate_benchmark:
        description: Measure the complete Generate group
        type: boolean
        default: false
      smoke_benchmark:
        description: Measure all seven impedance smoke stages
        type: boolean
        default: false
      source_snapshot_probe:
        description: Verify and measure complete source evidence
        type: boolean
        default: false
      generate_runs:
        description: Independent Generate measurements
        type: choice
        default: '3'
        options: ['1', '3']
jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - lane: ordinary-tests
            name: tests
            target: ordinary
          - lane: native-wx-0
            name: Native wx (controls)
            target: wx
            timeout_minutes: 20
          - lane: native-wx-1
            name: Native wx (isolated input)
            target: wx
          # KiCad 7 goldens use AMD64; the 8/9 PPAs lack ARM64 bindings.
          - lane: native-kicad-7
            name: Native KiCad 7
            target: kicad
            kicad: '7'
            timeout_minutes: 20
          - lane: native-kicad-8
            name: Native KiCad 8
            target: kicad
            kicad: '8'
            timeout_minutes: 20
          - lane: native-kicad-9
            name: Native KiCad 9
            target: kicad
            kicad: '9'
            timeout_minutes: 20
          - lane: native-kicad-10
            name: Native KiCad 10
            target: kicad
            kicad: '10'
            timeout_minutes: 70
    env:
      KICAD_CLI: /usr/bin/kicad-cli
      KICAD_CAPTURE_PNG: '1'
      KICAD_IMPEDANCE_NATIVE_BUDGET_PROFILE: ci
      NATIVE_GENERATE_BENCHMARK: >-
        ${{ github.event_name == 'workflow_dispatch' && matrix.kicad == '10' &&
        (inputs.generate_benchmark == true || inputs.generate_benchmark == 'true') && '1' || '0' }}
      NATIVE_SMOKE_BENCHMARK: >-
        ${{ github.event_name == 'workflow_dispatch' && matrix.kicad == '10' &&
        (inputs.smoke_benchmark == true || inputs.smoke_benchmark == 'true') && '1' || '0' }}
      NATIVE_SOURCE_SNAPSHOT_PROBE: >-
        ${{ github.event_name == 'workflow_dispatch' && matrix.kicad == '10' &&
        (inputs.source_snapshot_probe == true || inputs.source_snapshot_probe == 'true') && '1' || '0' }}
      NATIVE_GENERATE_RUNS: ${{ inputs.generate_runs || '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare dependency image
        env:
          KICAD_MAJOR: ${{ matrix.kicad }}
          LOCAL_ARCHITECTURE: ${{ vars.KICAD_VALIDATION_ARCHITECTURE }}
        run: |
          architecture=amd64
          if [[ ${ACT:-} == true && ( -z "$KICAD_MAJOR" || "$KICAD_MAJOR" == 10 ) ]]; then
            architecture=${LOCAL_ARCHITECTURE:-amd64}
          fi
          echo "ARCHITECTURE=$architecture" >> "$GITHUB_ENV"
          # Bump the prefix to refresh dependencies before the next UTC week.
          echo "DEPENDENCY_REVISION=1-$(date -u +%G-W%V)" >> "$GITHUB_ENV"
      - name: Cache Python downloads
        uses: actions/cache@v4
        with:
          path: .cache/native-tests/pip
          key: pip-lanes-${{ env.ARCHITECTURE }}-${{ hashFiles('pyproject.toml') }}
      - name: Prepare hosted image builder
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v4
      - name: Build hosted dependency image
        if: ${{ !env.ACT }}
        id: hosted
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: docker
          file: docker/native-tests.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ env.ARCHITECTURE }}
          build-args: |
            KICAD_MAJOR=${{ matrix.kicad }}
            DEPENDENCY_REVISION=${{ env.DEPENDENCY_REVISION }}
          load: true
          push: false
          cache-from: type=gha,scope=tests-${{ matrix.target }}-${{ matrix.kicad }}-${{ env.ARCHITECTURE }}
          cache-to: type=gha,mode=max,scope=tests-${{ matrix.target }}-${{ matrix.kicad }}-${{ env.ARCHITECTURE }}
      - name: Build local dependency image
        if: ${{ env.ACT }}
        id: local
        run: |
          docker build --load --platform "linux/$ARCHITECTURE" --target '${{ matrix.target }}' \
            --build-arg KICAD_MAJOR='${{ matrix.kicad }}' \
            --build-arg "DEPENDENCY_REVISION=$DEPENDENCY_REVISION" --file docker/native-tests.Dockerfile \
            --iidfile "$RUNNER_TEMP/image-id" docker
          echo "image=$(cat "$RUNNER_TEMP/image-id")" >> "$GITHUB_OUTPUT"
      - name: Run tests in dependency image
        env:
          IMAGE: ${{ steps.local.outputs.image || steps.hosted.outputs.imageid }}
          LANE: ${{ matrix.lane }}
        run: bash scripts/run_test_lane.sh "$IMAGE" "$LANE" "$ARCHITECTURE"
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.lane }}
          path: .cache/native-tests/${{ matrix.lane }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
