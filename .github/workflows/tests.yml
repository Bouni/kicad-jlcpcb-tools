---
name: Tests
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pytest
        run: pip install pytest
      - name: Install python packages
        run: pip install .
      - name: Run tests
        run: pytest -m 'not native_wx and not native_kicad'
  native-wx:
    name: Native wx (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: controls
            selection: not native_kicad and not os_input
          - lane: isolated input
            selection: os_input
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install wx and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-wxgtk4.0 python3-venv xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages .venv-wx
      - name: Install test dependencies
        run: .venv-wx/bin/python -m pip install '.[dev]'
      - name: Install a window manager for input and focus checks
        if: matrix.lane == 'isolated input'
        run: sudo apt-get install -y --no-install-recommends openbox
      - name: Run tests with native wx
        run: |
          timeout 360s xvfb-run -a -s '-screen 0 1920x1080x24' sh -c '
            if [ "$1" = "os_input" ]; then
              openbox >/dev/null 2>&1 &
              window_manager=$!
              trap "kill $window_manager 2>/dev/null || true" EXIT
            fi
            .venv-wx/bin/python -m pytest -rs --require-native=wx -m "$1"
          ' sh '${{ matrix.selection }}'
  native-kicad:
    name: Native KiCad 10
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KICAD_CLI: /usr/bin/kicad-cli
      KICAD_CAPTURE_PNG: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install KiCad 10 and matching system Python bindings
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 'kicad=10.*' python3-wxgtk4.0 python3-venv xvfb xauth x11-utils openbox
          /usr/bin/python3 -m venv --system-site-packages .venv-kicad
      - name: Install test dependencies
        run: .venv-kicad/bin/python -m pip install '.[dev]'
      - name: Prepare disposable native test preferences
        run: |
          mkdir -p "$RUNNER_TEMP/native-kicad/config/10.0"
          printf '%s\n' '{"appearance":{"color_theme":"_builtin_default"}}' > "$RUNNER_TEMP/native-kicad/config/10.0/pcbnew.json"
          echo "KICAD_CONFIG_HOME=$RUNNER_TEMP/native-kicad/config" >> "$GITHUB_ENV"
      - name: Require native variant editing, windows, and fabrication checks
        shell: bash
        run: |
          timeout 900s xvfb-run -a -s '-screen 0 1920x1080x24' \
          .venv-kicad/bin/python -m pytest -rs \
          --require-native=kicad -m native_kicad \
          --basetemp="$RUNNER_TEMP/native-kicad/pytest-work" \
          --junitxml="$RUNNER_TEMP/native-kicad/pytest.xml" \
          2>&1 | tee "$RUNNER_TEMP/native-kicad/pytest.log"
      - name: Exercise native impedance review and reports
        shell: bash
        run: |
          timeout 900s xvfb-run -a -s '-screen 0 1920x1080x24' sh -eu -c '
            openbox >"$RUNNER_TEMP/native-kicad/openbox.log" 2>&1 &
            window_manager=$!
            trap "kill $window_manager 2>/dev/null || true" EXIT
            for attempt in $(seq 1 50); do
              kill -0 "$window_manager"
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id #"; then
                .venv-kicad/bin/python scripts/linux_native_impedance_smoke.py \
                  --output "$RUNNER_TEMP/native-kicad/impedance" --timeout 600
                exit $?
              fi
              sleep 0.1
            done
            echo "Openbox did not become ready" >&2
            exit 1
          ' 2>&1 | tee "$RUNNER_TEMP/native-kicad/impedance.log"
      - name: Retain native workflow products and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-kicad
          path: ${{ runner.temp }}/native-kicad
          if-no-files-found: error
          retention-days: 14
