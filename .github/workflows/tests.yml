---
name: Tests
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - lane: ordinary-tests
            name: tests
            target: ordinary
          - lane: native-wx-0
            name: Native wx (controls)
            target: wx
            timeout_minutes: 20
          - lane: native-wx-1
            name: Native wx (isolated input)
            target: wx
          # KiCad 7 goldens use AMD64; the 8/9 PPAs lack ARM64 bindings.
          - lane: native-kicad-7
            name: Native KiCad 7
            target: kicad
            kicad: '7'
            timeout_minutes: 20
          - lane: native-kicad-8
            name: Native KiCad 8
            target: kicad
            kicad: '8'
            timeout_minutes: 20
          - lane: native-kicad-9
            name: Native KiCad 9
            target: kicad
            kicad: '9'
            timeout_minutes: 20
          - lane: native-kicad-10
            name: Native KiCad 10
            target: kicad
            kicad: '10'
            timeout_minutes: 35
    env:
      ARCHITECTURE: ${{ matrix.kicad && matrix.kicad != '10' && 'amd64' || vars.KICAD_VALIDATION_ARCHITECTURE || 'amd64' }}
      KICAD_CLI: /usr/bin/kicad-cli
      KICAD_CAPTURE_PNG: '1'
      KICAD_IMPEDANCE_NATIVE_BUDGET_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
      - name: Cache Python downloads
        uses: actions/cache@v4
        with:
          path: .cache/native-tests/pip
          key: pip-lanes-${{ env.ARCHITECTURE }}-${{ hashFiles('pyproject.toml') }}
      - name: Prepare hosted image builder
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@v4
      - name: Build hosted dependency image
        if: ${{ !env.ACT }}
        id: hosted
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: docker
          file: docker/native-tests.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ env.ARCHITECTURE }}
          build-args: KICAD_MAJOR=${{ matrix.kicad }}
          load: true
          push: false
          cache-from: type=gha,scope=tests-${{ matrix.target }}-${{ matrix.kicad }}-${{ env.ARCHITECTURE }}
          cache-to: type=gha,mode=max,scope=tests-${{ matrix.target }}-${{ matrix.kicad }}-${{ env.ARCHITECTURE }}
      - name: Build local dependency image
        if: ${{ env.ACT }}
        id: local
        run: |
          docker build --load --platform "linux/$ARCHITECTURE" --target '${{ matrix.target }}' \
            --build-arg KICAD_MAJOR='${{ matrix.kicad }}' --file docker/native-tests.Dockerfile \
            --iidfile "$RUNNER_TEMP/image-id" docker
          echo "image=$(cat "$RUNNER_TEMP/image-id")" >> "$GITHUB_OUTPUT"
      - name: Run tests in dependency image
        env:
          IMAGE: ${{ steps.local.outputs.image || steps.hosted.outputs.imageid }}
          LANE: ${{ matrix.lane }}
        run: bash scripts/run_test_lane.sh "$IMAGE" "$LANE" "$ARCHITECTURE"
      - name: Retain test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane }}
          path: .cache/native-tests/${{ matrix.lane }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
